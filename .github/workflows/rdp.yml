name: AvicaRDP
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Direct Avica Setup
        run: |
          Write-Host "Starting Avica setup..." -ForegroundColor Green
          Invoke-WebRequest -Uri "https://gitlab.com/userup908/my-rdp/-/raw/main/setup.py" -OutFile "setup.py"
          Invoke-WebRequest -Uri "https://download.avica.com/AvicaLite_v8.0.8.9.exe" -OutFile "Avica_setup.exe"

          python.exe -m pip install requests pyautogui --quiet

          net user runneradmin TheDisa1a

          Start-Process "Avica_setup.exe"
          Start-Sleep -Seconds 5
          python setup.py

          Write-Host "Setup finished - look for the gofile link above" -ForegroundColor Green

      - name: Keep Session Alive And Re-Publish Screen
        run: |
          @'
          import time, requests, pyautogui
          end = time.time() + 19000
          while time.time() < end:
              try:
                  pyautogui.screenshot().save("shot.png")
                  with open("shot.png", "rb") as f:
                      r = requests.post("https://store1.gofile.io/uploadFile", files={"file": f})
                  if r.json().get("status") == "ok":
                      print("NEW SCREENSHOT:", r.json()["data"]["downloadPage"], flush=True)
              except Exception as e:
                  print("upload failed:", e, flush=True)
              time.sleep(1200)
          '@ | Set-Content -Encoding UTF8 keepalive.py
          python keepalive.py