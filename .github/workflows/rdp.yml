name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pyautogui pillow pyscreeze requests psutil
          python -c "import PIL, pyscreeze, pyautogui, psutil; print('PIL', PIL.__version__, '| pyautogui ok')"

      - name: Download Avica
        run: |
          Invoke-WebRequest -Uri "https://download.avica.com/AvicaLite_v8.0.8.9.exe" -OutFile "Avica_setup.exe"
          Get-Item Avica_setup.exe | Select-Object Name, Length

      - name: Run probe
        run: python probe.py

      - name: Upload screenshots as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: "*.png"
          if-no-files-found: warn
