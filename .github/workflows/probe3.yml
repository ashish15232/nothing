name: probe3

on:
  workflow_dispatch:

jobs:
  probe3:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pyautogui pillow pyscreeze requests psutil pywinauto comtypes
          python -c "import pyautogui, pywinauto, PIL; print('deps ok, PIL', PIL.__version__)"

      - name: Download Avica
        run: |
          Invoke-WebRequest -Uri "https://download.avica.com/AvicaLite_v8.0.8.9.exe" -OutFile "Avica_setup.exe"
          Get-Item Avica_setup.exe | Select-Object Name, Length

      - name: Dump installer UI and drive by geometry
        shell: python
        run: |
          import os, subprocess, time
          import requests, pyautogui
          from pywinauto import Desktop

          def shot(tag):
              n = f"{tag}.png"
              try:
                  pyautogui.screenshot().save(n)
              except Exception as e:
                  print("SHOT", tag, "FAILED", repr(e), flush=True)
                  return
              try:
                  with open(n, "rb") as f:
                      r = requests.post("https://store1.gofile.io/uploadFile", files={"file": f}, timeout=120)
                  print("SHOT", tag, ":", r.json().get("data", {}).get("downloadPage"), flush=True)
              except Exception as e:
                  print("SHOT", tag, "UPLOAD FAILED", repr(e), flush=True)

          def kill(name):
              p = subprocess.run(["taskkill", "/F", "/T", "/IM", name], capture_output=True, text=True)
              print("kill", name, "rc", p.returncode, (p.stdout or "").strip()[:150], flush=True)

          def find_win(sub="avica"):
              try:
                  for w in Desktop(backend="uia").windows():
                      try:
                          t = w.window_text() or ""
                      except Exception:
                          continue
                      if sub in t.lower():
                          return w
              except Exception as e:
                  print("enum failed", repr(e), flush=True)
              return None

          def walk_avica():
              hits = []
              for root in (r"C:\Program Files", r"C:\Program Files (x86)",
                           os.path.expanduser(r"~\AppData")):
                  if not os.path.isdir(root):
                      continue
                  base = root.count(os.sep)
                  for dp, dn, fn in os.walk(root):
                      if dp.count(os.sep) - base > 3:
                          dn[:] = []
                          continue
                      for f in fn:
                          if f.lower().endswith(".exe") and "avica" in f.lower():
                              hits.append(os.path.join(dp, f))
              return sorted(set(hits))

          def dump(w, tag):
              try:
                  r = w.rectangle()
                  print(f"DUMP[{tag}] title={w.window_text()!r} rect=({r.left},{r.top},{r.right},{r.bottom}) "
                        f"size={r.right-r.left}x{r.bottom-r.top}", flush=True)
              except Exception as e:
                  print(f"DUMP[{tag}] rect failed {e!r}", flush=True)
                  return
              try:
                  kids = w.descendants()
              except Exception as e:
                  print(f"DUMP[{tag}] descendants failed {e!r}", flush=True)
                  return
              print(f"DUMP[{tag}] {len(kids)} descendants", flush=True)
              for c in kids:
                  try:
                      ci = c.element_info
                      rr = c.rectangle()
                      txt = c.window_text()
                      print(f"   {ci.control_type:18} cls={ci.class_name!r:28} "
                            f"text={txt!r:38} at=({rr.left},{rr.top},{rr.right},{rr.bottom})",
                            flush=True)
                  except Exception:
                      pass

          def rel_click(w, fx, fy, tag):
              try:
                  r = w.rectangle()
                  x = int(r.left + (r.right - r.left) * fx)
                  y = int(r.top + (r.bottom - r.top) * fy)
                  try:
                      w.set_focus()
                  except Exception:
                      pass
                  time.sleep(0.6)
                  pyautogui.click(x, y)
                  print(f"  RELCLICK[{tag}] ({fx},{fy}) -> ({x},{y})", flush=True)
                  return True
              except Exception as e:
                  print(f"  RELCLICK[{tag}] failed {e!r}", flush=True)
                  return False

          def click_buttons(w, keywords):
              hit = False
              try:
                  for c in w.descendants():
                      try:
                          if c.element_info.control_type not in ("Button", "Hyperlink", "CheckBox"):
                              continue
                          txt = (c.window_text() or "").strip().lower()
                      except Exception:
                          continue
                      if not txt:
                          continue
                      if any(k in txt for k in keywords):
                          try:
                              c.click_input()
                              print(f"  BTNCLICK {txt!r}", flush=True)
                              hit = True
                          except Exception as e:
                              print(f"  BTNCLICK {txt!r} failed {e!r}", flush=True)
              except Exception as e:
                  print("  click_buttons failed", repr(e), flush=True)
              return hit

          print("=== clear ===", flush=True)
          kill("Avica_setup.exe")
          kill("Avica.exe")
          time.sleep(3)
          shot("p3-00-clean")

          print("=== launch ===", flush=True)
          exe = os.path.abspath("Avica_setup.exe")
          print("installer", exe, os.path.getsize(exe), "bytes", flush=True)
          subprocess.Popen([exe])

          w = None
          for i in range(20):
              time.sleep(3)
              w = find_win("avica")
              if w:
                  print(f"window found after {(i+1)*3}s", flush=True)
                  break
          if not w:
              print("NO AVICA WINDOW - aborting", flush=True)
              shot("p3-fail-nowindow")
              raise SystemExit(1)

          dump(w, "first")
          shot("p3-01-installer")

          print("=== drive: buttons by name, then geometry ===", flush=True)
          seq = [(0.86, 0.94), (0.74, 0.94), (0.90, 0.88), (0.60, 0.90), (0.50, 0.50)]
          for step in range(12):
              got = walk_avica()
              if got:
                  print("INSTALLED:", got, flush=True)
                  break
              w = find_win("avica") or w
              acted = click_buttons(w, ["next", "install", "agree", "accept", "yes", "ok", "finish", "run"])
              if not acted:
                  fx, fy = seq[min(step, len(seq) - 1)]
                  rel_click(w, fx, fy, f"s{step}")
              else:
                  time.sleep(2)
              shot(f"p3-02-step{step}")
              dump(w, f"step{step}")
              time.sleep(3)

          cands = walk_avica()
          print("final candidates:", cands, flush=True)
          shot("p3-03-after-drive")

          if cands:
              tgt = [c for c in cands if c.lower().endswith("avica.exe")] or cands
              tgt = tgt[0]
              print("launching", tgt, flush=True)
              try:
                  subprocess.Popen([tgt])
              except Exception as e:
                  print("launch failed", repr(e), flush=True)
              for i in range(10):
                  time.sleep(3)
                  aw = find_win("avica")
                  if aw:
                      dump(aw, "app")
                      shot("p3-04-app-window")
                      break
              else:
                  print("no app window after launch", flush=True)
                  shot("p3-04-no-window")

          shot("p3-05-final")
          print("DONE", flush=True)

      - name: Upload screenshots as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots3
          path: "*.png"
          if-no-files-found: warn
